function render(){document.getElementById('crumbName').textContent=viewNames[state.view];document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.getElementById('mobileNav').value=state.view;const main=document.getElementById('main');if(state.view==='workbench')main.innerHTML=workbenchHTML();else if(state.view==='assets')main.innerHTML=assetsHTML();else if(state.view==='design')main.innerHTML=designHTML();else if(state.view==='production')main.innerHTML=productionHTML();else if(state.view==='effects')main.innerHTML=effectsHTML();else main.innerHTML=configHTML();bindMain();iconRefresh()}

function workbenchHTML(){const pending=items.filter(x=>x.status==='待审批');const drafts=items.filter(x=>x.status==='草稿'||x.status==='变更中');return head('内容工作台','聚合待办、草稿、反馈与到期任务，按优先级推进。','<button class="btn" data-go="assets"><i data-lucide="list"></i>全部条目</button>')+
'<div class="metric-strip"><div class="metric"><span>待我审批</span><strong>'+pending.length+'</strong></div><div class="metric"><span>我的草稿</span><strong>'+drafts.length+'</strong></div><div class="metric"><span>本周到期</span><strong>3</strong><small>需复审</small></div><div class="metric"><span>待处理反馈</span><strong>6</strong><small>+2 今日</small></div></div>'+ 
'<div class="cards-grid"><div class="work-card"><h3>知识缺口</h3><p>来自搜索无结果、员工求助与 Agent 未命中。</p><span class="big">9</span><button class="btn sm link" data-go="production">进入规划</button></div><div class="work-card"><h3>本周发布</h3><p>已通过审批并进入员工知识库的有效版本。</p><span class="big">12</span><span class="link">较上周 +3</span></div><div class="work-card"><h3>待修订</h3><p>低评分、即将到期或业务规则已变化的知识。</p><span class="big">5</span><button class="btn sm link" data-go="effects">查看效果</button></div></div>'+queueHTML('待审批',pending,'审批人需核对字段、来源与生效范围。')+queueHTML('草稿与变更',drafts,'编辑会创建新版本；草稿可删除且不可撤销。')}
function queueHTML(title,arr,desc){return '<section class="table-card queue"><div class="table-meta"><div><strong>'+title+'</strong> '+desc+'</div><span style="margin-left:auto">'+arr.length+' 条</span></div>'+arr.map(x=>'<div class="queue-row" data-id="'+x.id+'"><div class="q-main"><strong>'+x.title+'</strong><small>'+x.domain+' / '+x.topic+' · '+x.owner+' · '+x.version+' · '+x.time+'</small></div><span class="tag '+(x.model==='结构化'?'structured':'unstructured')+'">'+x.model+'</span><span class="tag carrier">'+x.carrier+'</span><button class="btn sm">'+(x.status==='待审批'?'审核':'继续编辑')+'</button></div>').join('')+'</section>'}
function productionHTML(){return head('知识生产','从缺口规划、内容设计到草稿、审批与发布的连续管道。','<button class="btn primary" data-new><i data-lucide="plus"></i>新建知识</button>')+

'<div class="metric-strip"><div class="metric"><span>规划池</span><strong>9</strong></div><div class="metric"><span>设计中</span><strong>4</strong></div><div class="metric"><span>草稿</span><strong>2</strong></div><div class="metric"><span>审批中</span><strong>2</strong></div></div>'+queueHTML('生产队列',items.filter(x=>['草稿','变更中','待审批'].includes(x.status)),'从需求到发布，每一步都有明确责任人和版本记录。')}
function assetsHTML(){return head('知识资产','跨领域查看全量条目；内容模型与载体分别筛选。','<button class="btn" data-go="design"><i data-lucide="blocks"></i>Schema 管理</button><button class="btn primary" data-new><i data-lucide="plus"></i>新建知识</button>')+

function assetPanelHTML(){if(state.assetTab==='items')return '<div class="notice"><i data-lucide="split"></i><div><strong>知识模型 × 载体相互独立。</strong>结构化知识绑定 Schema，可来自在线表单或文件模板；非结构化知识用于全文与向量检索。</div></div>'+filtersHTML()+tableHTML(filteredItems());if(state.assetTab==='catalog')return '<div class="compact-panel"><div class="compact-row"><strong>供应链</strong><p>采购 · 供应商开发</p><button class="btn sm" data-open-panel="catalog-supply">查看 3 条</button></div><div class="compact-row"><strong>营销</strong><p>内容营销 · 线索培育</p><button class="btn sm" data-open-panel="catalog-marketing">查看 2 条</button></div><div class="compact-row"><strong>客服</strong><p>安装售后 · 工单处理 · 退换货</p><button class="btn sm" data-open-panel="catalog-service">查看 3 条</button></div></div>';if(state.assetTab==='libraries')return '<div class="compact-panel"><div class="compact-row"><strong>员工知识库</strong><p>面向全体员工 · 已发布 6 条</p><button class="btn sm" data-open-panel="library-staff">管理范围</button></div><div class="compact-row"><strong>供应链知识库</strong><p>供应链团队 · 已发布 2 条</p><button class="btn sm" data-open-panel="library-supply">管理范围</button></div><div class="compact-row"><strong>客服知识库</strong><p>客服与售后团队 · 已发布 1 条</p><button class="btn sm" data-open-panel="library-service">管理范围</button></div></div>';return '<div class="compact-panel"><div class="compact-row"><strong>供应商询价模板_v2.docx</strong><p>结构化文件 · 已解析 4 个字段 · 今天 08:31</p><button class="btn sm" data-open-panel="import-1">查看记录</button></div><div class="compact-row"><strong>储能电池安装与保养手册.pdf</strong><p>非结构化文件 · 已完成全文索引 · 9月30日 14:03</p><button class="btn sm" data-open-panel="import-2">查看记录</button></div></div>'}
function filtersHTML(){return '<div class="filterbar"><div class="searchbox"><i data-lucide="search"></i><input id="searchInput" placeholder="搜索标题、正文或字段" value="'+state.query+'"></div><select id="domainFilter"><option>全部领域</option><option>供应链</option><option>营销</option><option>客服</option></select><select id="modelFilter"><option>全部模型</option><option>结构化</option><option>非结构化</option></select><select id="carrierFilter"><option>全部载体</option><option>在线编辑</option><option>文件上传</option></select><select id="statusFilter"><option>全部状态</option><option>草稿</option><option>待审批</option><option>已发布</option><option>变更中</option><option>归档</option></select></div>'}

function tableHTML(arr){if(!arr.length)return '<div class="table-card empty">没有符合条件的知识条目</div>';return '<div class="table-card"><div class="table-meta"><strong>'+arr.length+'</strong> 条知识 <span style="margin-left:auto">点击任一行查看详情</span></div><table class="table"><thead><tr><th style="width:24%">标题</th><th style="width:10%">内容模型</th><th style="width:10%">载体</th><th style="width:15%">领域 / 主题</th><th style="width:9%">状态</th><th style="width:6%">版本</th><th style="width:7%">责任人</th><th style="width:12%">更新时间</th><th style="width:4%"></th></tr></thead><tbody>'+arr.map(x=>'<tr data-id="'+x.id+'"><td class="title-cell">'+x.title+'</td><td><span class="tag '+(x.model==='结构化'?'structured':'unstructured')+'">'+x.model+'</span></td><td><span class="tag carrier">'+x.carrier+'</span></td><td>'+x.domain+' / '+x.topic+'</td><td><span class="tag status '+statusClass(x.status)+'">'+x.status+'</span></td><td>'+x.version+'</td><td>'+x.owner+'</td><td>'+x.time+'</td><td><button class="more-btn" aria-label="查看"><i data-lucide="chevron-right"></i></button></td></tr>').join('')+'</tbody></table></div>'}

function kvFields(fs){return '<div class="kv">'+fs.map(f=>'<div class="k">'+f[0]+'</div><div>'+f[1]+'</div>').join('')+'</div>'}
function filePreview(o,structured){return '<div class="section-title"><strong>文件预览</strong><span>'+(o.file||o.title)+'</span></div><div class="file-preview"><div class="filebar"><i data-lucide="file-text"></i>'+(o.file||o.title)+'</div><div class="filepage"><h4>'+(structured?'业务邮件模板':'文件内容预览')+'</h4>'+(structured?'<p>尊敬的 <span class="var">{{supplier_contact}}</span>：</p><p>您好，我们正在进行 <span class="var">{{product_name}}</span> 的采购评估，预计数量为 <span class="var">{{quantity}}</span>。</p><p>请于 <span class="var">{{deadline}}</span> 前反馈报价与交期。</p>':'<p>安装前请确认设备断电，并核对型号、额定电压和线缆规格。</p><p>本文件将通过全文与向量索引参与检索，不提供预定义字段筛选。</p>')+'</div></div>'}
function editContent(o){if(o.model==='结构化'){return '<div class="field"><label>知识条目名称</label><input id="editTitle" value="'+o.title+'"></div><div class="field"><label>绑定 Schema</label><input disabled value="'+o.schema+'"></div>'+(o.carrier==='文件上传'?'<div class="field"><label>替换模板文件</label><div class="upload"><input type="file" id="replaceFile"><div class="hint">替换文件不会修改条目标题；系统将重新解析占位符。</div></div></div>':'')+'<div class="section-title"><strong>结构化字段</strong><span>支持人工校正</span></div><div class="field-list">'+o.fields.map(f=>'<div class="field-row"><input value="'+f[0]+'"><span>文本</span><span class="required">必填</span><input value="'+f[1]+'"></div>').join('')+'</div><button class="btn sm" id="addDrawerField"><i data-lucide="plus"></i>添加字段</button>'}if(o.carrier==='在线编辑')return '<div class="field"><label>知识条目名称</label><input id="editTitle" value="'+o.title+'"></div><div class="field"><label>正文</label><div class="rich-editor"><div class="toolbar"><button data-command="bold" aria-label="加粗"><b>B</b></button><button data-command="italic" aria-label="斜体"><i>I</i></button><button data-command="insertUnorderedList" aria-label="项目符号列表">≡</button></div><div class="editor-area" id="editorArea" contenteditable="true">'+o.body+'</div></div></div>';return '<div class="field"><label>条目标题（与文件名同步）</label><input id="editTitle" disabled value="'+o.title+'"><div class="hint">非结构化文件的标题不可单独修改。</div></div><div class="field"><label>替换文件</label><div class="upload"><input type="file" id="replaceFile"><div class="hint">选择新文件后，条目标题会同步变为新文件名。</div></div></div>'}
function versionContent(o){return '<div class="section-title"><strong>版本记录</strong><span>当前 '+o.version+'</span></div><div class="field-list"><div class="field-row"><strong>'+o.version+' 当前版本</strong><span>'+o.owner+'</span><span></span><span>'+o.time+' · '+(o.model==='结构化'?'字段与内容更新':'文件内容更新')+'</span></div><div class="field-row"><strong>V'+Math.max(1,Number(o.version.slice(1))-1)+'</strong><span>'+o.owner+'</span><span></span><span>上一版本 · 可查看差异</span></div></div><div class="notice"><i data-lucide="git-compare"></i>'+(o.model==='结构化'?'版本对比包含结构化字段差异与文件内容差异。':'版本记录保留正文或文件名变化。')+'</div>'}
function bind(){document.getElementById('closeDrawer').onclick=()=>root.innerHTML='';document.getElementById('drawerShade').onclick=e=>{if(e.target.id==='drawerShade')root.innerHTML=''};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});const eb=document.querySelector('[data-edit]');if(eb)eb.onclick=()=>{if(mode!=='edit'){mode='edit';draw()}else{const t=document.getElementById('editTitle');if(t&&!t.disabled)x.title=t.value;const rf=document.getElementById('replaceFile');if(rf&&rf.files[0]&&x.model==='非结构化')x.title=rf.files[0].name;x.version='V'+(Number(x.version.slice(1))+1);x.status='变更中';x.time='刚刚';draw();render();showToast('已保存为 '+x.version+' 新版本')}};const rf=document.getElementById('replaceFile');if(rf)rf.onchange=()=>{if(x.model==='非结构化'&&rf.files[0])document.getElementById('editTitle').value=rf.files[0].name};const ap=document.getElementById('approveBtn');if(ap)ap.onclick=()=>{x.status='已发布';x.time='刚刚';root.innerHTML='';render();showToast('审批通过，已发布到员工知识库')};const rb=document.getElementById('rejectBtn');if(rb)rb.onclick=()=>{reject=true;draw()};const cr=document.getElementById('confirmReject');if(cr)cr.onclick=()=>{if(!document.getElementById('rejectReason').value.trim()){showToast('请填写驳回原因');return}x.status='草稿';root.innerHTML='';render();showToast('已驳回并退回责任人修改')};const af=document.getElementById('addDrawerField');if(af)af.onclick=()=>{x.fields.push(['新字段','—']);draw();showToast('已添加字段，可在当前版本中编辑')};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{document.getElementById('editorArea').focus();document.execCommand(b.dataset.command,false,null)});document.getElementById('copyLink').onclick=()=>{const code='KB-'+x.id;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(()=>showToast('条目编号已复制')).catch(()=>showToast('复制失败，请手动记录 '+code));else showToast('条目编号：'+code)}}draw()}
function openSchemaModal(isNew){const s=isNew?{name:'',desc:'',fields:[['字段名称','文本','是','人工录入']]}:JSON.parse(JSON.stringify(schemas[state.activeSchema]));const root=document.getElementById('overlayRoot');function draw(){root.innerHTML='<div class="overlay"><div class="modal wide"><div class="modal-head"><h2>'+(isNew?'新建 Schema':'编辑 Schema')+'</h2><button class="icon-btn" id="closeSchema"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="form-row"><div class="field"><label>Schema 名称</label><input id="schemaName" value="'+s.name+'" placeholder="例如：产品参数模板"></div><div class="field"><label>说明</label><input id="schemaDesc" value="'+s.desc+'" placeholder="说明适用范围"></div></div><div class="section-title"><strong>字段定义</strong><span>文件上传时可配置自动提取规则</span></div><div id="schemaFields">'+s.fields.map((f,i)=>'<div class="field-row"><input data-f="0" data-i="'+i+'" value="'+f[0]+'"><select data-f="1" data-i="'+i+'"><option>文本</option><option>数字</option><option>日期</option><option>枚举</option><option>数组</option></select><select data-f="2" data-i="'+i+'"><option>是</option><option>否</option></select><input data-f="3" data-i="'+i+'" value="'+f[3]+'"></div>').join('')+'</div><button class="btn sm" id="addField"><i data-lucide="plus"></i>添加字段</button></div><div class="modal-foot"><span></span><div class="right"><button class="btn" id="cancelSchema">取消</button><button class="btn primary" id="saveSchema">保存 Schema</button></div></div></div></div>';document.querySelectorAll('[data-i]').forEach(el=>{el.value=s.fields[Number(el.dataset.i)][Number(el.dataset.f)];el.onchange=()=>s.fields[Number(el.dataset.i)][Number(el.dataset.f)]=el.value});document.getElementById('closeSchema').onclick=()=>root.innerHTML='';document.getElementById('cancelSchema').onclick=()=>root.innerHTML='';document.getElementById('addField').onclick=()=>{s.fields.push(['新字段','文本','否','人工录入']);draw()};document.getElementById('saveSchema').onclick=()=>{s.name=document.getElementById('schemaName').value.trim();s.desc=document.getElementById('schemaDesc').value.trim();if(!s.name){showToast('请填写 Schema 名称');return}if(isNew){s.used=0;schemas.push(s);state.activeSchema=schemas.length-1}else schemas[state.activeSchema]=s;root.innerHTML='';render();showToast('Schema 已保存')};iconRefresh()}draw()}
function showPreview(){document.getElementById('adminApp').classList.add('hidden');const root=document.getElementById('previewApp');root.classList.remove('hidden');root.innerHTML='<header class="preview-top"><strong class="preview-brand">员工知识库</strong><span style="color:var(--muted);font-size:12px">只展示已发布内容</span><button class="btn" id="backAdmin"><i data-lucide="arrow-left"></i>返回管理端</button></header><main class="preview-main"><section class="preview-hero"><div><h1>今天想了解什么？</h1><p>搜索业务知识，或直接描述你的问题。回答会标明引用来源，便于核对。</p></div><div class="askbox"><input id="userSearch" placeholder="搜索知识或提问…"><button id="userSearchBtn"><i data-lucide="arrow-right"></i></button></div></section><section class="preview-section"><h2>按领域浏览</h2><div class="domain-grid"><div class="domain"><strong>供应链</strong><p>采购、供应商开发、交付与质量</p><span>28 条已发布知识</span></div><div class="domain"><strong>营销</strong><p>品牌、内容、线索培育与活动</p><span>36 条已发布知识</span></div><div class="domain"><strong>客服</strong><p>安装、工单、退换货与售后政策</p><span>41 条已发布知识</span></div></div></section><section class="preview-section"><h2 id="previewListTitle">常用知识</h2><div class="article-list" id="previewArticles">'+publishedArticles(items.filter(x=>x.status==='已发布'))+'</div></section></main>';document.getElementById('backAdmin').onclick=()=>{root.classList.add('hidden');document.getElementById('adminApp').classList.remove('hidden')};document.getElementById('userSearchBtn').onclick=searchPreview;document.getElementById('userSearch').onkeydown=e=>{if(e.key==='Enter')searchPreview()};bindPreviewArticles();iconRefresh()}
function publishedArticles(arr){return arr.map(x=>'<div class="article" data-preview-id="'+x.id+'"><strong>'+x.title+'</strong><p>'+x.domain+' · '+x.topic+' · 更新于 '+x.time+'</p></div>').join('')||'<div class="empty">没有找到相关知识，已可提交知识缺口。</div>'}
function searchPreview(){const q=document.getElementById('userSearch').value.trim();const arr=items.filter(x=>x.status==='已发布'&&(!q||(x.title+x.domain+x.topic).includes(q)));document.getElementById('previewListTitle').textContent=q?'搜索结果':'常用知识';document.getElementById('previewArticles').innerHTML=publishedArticles(arr);bindPreviewArticles();showToast(arr.length?'找到 '+arr.length+' 条已发布知识':'未找到结果，可反馈知识缺口')}
function bindPreviewArticles(){document.querySelectorAll('[data-preview-id]').forEach(el=>el.onclick=()=>{const x=items.find(i=>i.id===Number(el.dataset.previewId));document.getElementById('previewArticles').innerHTML='<article class="doc-preview"><button class="btn sm" id="backList"><i data-lucide="arrow-left"></i>返回</button><h3 style="margin-top:20px">'+x.title+'</h3>'+(x.body||'<p>这是一条经过审批发布的业务知识。你可以查看内容，并通过下方反馈帮助责任人持续改进。</p>')+'<div class="feedback"><span style="font-size:12px;color:var(--muted);align-self:center">这条知识有帮助吗？</span><button class="btn sm" data-feedback>有帮助</button><button class="btn sm" data-feedback>需要改进</button></div></article>';document.getElementById('backList').onclick=showPreview;document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>showToast('反馈已记录，将进入管理端待办'));iconRefresh()})}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.getElementById('mobileNav').onchange=e=>{state.view=e.target.value;render()};document.getElementById('newBtn').onclick=openNew;document.getElementById('previewBtn').onclick=showPreview;render();
</script>
</body>
</html>
