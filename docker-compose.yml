services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingong}
      POSTGRES_USER: ${POSTGRES_USER:-lingong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  schema-init:
    build: .
    command: ["sh", "-c", "npm run db:apply:postgres-schema && npm run db:seed:reference"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lingong}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-lingong}
    depends_on:
      postgres:
        condition: service_healthy

  lingong:
    build: .
    ports:
      - "8765:8765"
    environment:
      STARRY_MODE: ${STARRY_MODE:-mock}
      CLAW_MODE: ${CLAW_MODE:-mock}
      LINGONG_DATA: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-lingong}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-lingong}
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /root/.codex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - lingong-data:/app/data
      - ${HOME}/.codex:/root/.codex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully

  outbox-publisher:
    build: .
    command: ["npm", "run", "worker:outbox"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lingong}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-lingong}
      REDIS_URL: redis://redis:6379
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully

  execution-worker:
    build: .
    command: ["npm", "run", "worker:execution"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lingong}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-lingong}
      REDIS_URL: redis://redis:6379
      EXECUTION_WORKER_CONCURRENCY: ${EXECUTION_WORKER_CONCURRENCY:-4}
      LINGONG_DATA: /app/data
    volumes:
      - lingong-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully

volumes:
  lingong-data:
  postgres-data:
  redis-data:
