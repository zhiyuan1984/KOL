# 服务器 nginx 站点配置：静态 SPA 从 /var/www/lingong/ui/current 提供；
# /api 和 /mock（含无尾斜杠）才代理至 127.0.0.1:8765（lingong.service）。
# 安装位置：/etc/nginx/conf.d/app.conf（改完 sudo nginx -t && sudo systemctl reload nginx）。
# current 是指向完整提交 SHA 静态 release 的原子符号链接。不要把 /home 或仓库目录
# 配为 root；发布脚本只写入 /var/www/lingong/ui 下的受限静态目录。
server {
    listen 80;
    server_name 47.88.94.205;

    # 知识库上传（PDF/图片/音视频）走 /api/ multipart；nginx 默认 client_max_body_size
    # 仅 1m，会在后端看到请求之前直接回 413。放宽到与后端 KNOWLEDGE_DOC_MAX_BYTES
    # 默认值（512 MiB）一致，超限时由后端返回中文友好错误而非 nginx 默认 413 页面。
    client_max_body_size 512m;

    # The SPA ships a ~1MB JS bundle and this instance has a slow uplink;
    # without gzip_types nginx only compresses text/html (JS/CSS/JSON pass through raw).
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Exact locations are intentional: /api and /mock must retain backend errors
    # rather than falling through to index.html or producing a static 404.
    location = /api {
        proxy_pass http://127.0.0.1:8765;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 240s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Starry 导入最多 120s，超时后的核对总预算 100s；留出余量避免 nginx 先返回 504。
        proxy_read_timeout 240s;
    }

    location = /mock {
        proxy_pass http://127.0.0.1:8765;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /mock/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Keep all hashed assets outside current so a tab holding an older index.html
    # can still load its immutable /assets/<hash> bundle after current switches.
    location ^~ /assets/ {
        root /var/www/lingong/ui;
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never send index.html for a requested static resource. Only the shared
    # /assets hash pool is immutable: public files under current (favicon,
    # manifest, release metadata) may keep their stable names and are no-cache.
    location ~* \.(?:avif|bmp|css|gif|ico|jpe?g|js|json|map|mjs|png|svg|txt|wasm|webp|woff2?|ttf|eot)$ {
        root /var/www/lingong/ui/current;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        root /var/www/lingong/ui/current;
        add_header Cache-Control "no-store" always;
    }

    location = /release.json {
        root /var/www/lingong/ui/current;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /var/www/lingong/ui/current;
        try_files $uri $uri/ @spa;
    }

    # Only route-like requests use the SPA fallback. A missing index is a real 404,
    # which prevents nginx from masking an incomplete or uninstalled UI release.
    location @spa {
        root /var/www/lingong/ui/current;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }
}
