# 服务器 nginx 站点配置：80 → 127.0.0.1:8765（lingong.service）。
# 安装位置：/etc/nginx/conf.d/app.conf（改完 sudo nginx -t && sudo systemctl reload nginx）。
# 页面请求在后端 502/504 时返回 /var/www/lingong/__booting.html（源文件 ops/nginx/booting.html），
# 状态码仍是 502；/api/ 与 /mock/ 不拦截，前端 fetch 拿到的仍是真实状态码。
server {
    listen 80;
    server_name 47.88.94.205;

    # 知识库上传（PDF/图片/音视频）走 /api/ multipart；nginx 默认 client_max_body_size
    # 仅 1m，会在后端看到请求之前直接回 413。放宽到与后端 KNOWLEDGE_DOC_MAX_BYTES
    # 默认值（512 MiB）一致，超限时由后端返回中文友好错误而非 nginx 默认 413 页面。
    client_max_body_size 512m;

    # The SPA ships a ~1MB JS bundle and this instance has a slow uplink;
    # without gzip_types nginx only compresses text/html (JS/CSS/JSON pass through raw).
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Starry 导入最多 120s，超时后的核对总预算 100s；留出余量避免 nginx 先返回 504。
        proxy_read_timeout 240s;
    }

    location /mock/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_intercept_errors on;
        error_page 502 504 /__booting.html;
    }

    location = /__booting.html {
        internal;
        root /var/www/lingong;
        add_header Cache-Control "no-store" always;
    }
}
