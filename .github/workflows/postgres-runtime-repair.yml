name: lingong-postgres-runtime-repair

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Main revision containing the verified PostgreSQL runtime repair"
        required: true
        default: "main"
        type: string

concurrency:
  group: lingong-postgres-runtime-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Apply idempotent schema migration and restart API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_HOST: 47.88.94.205
      DEPLOY_USER: ecs-user
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure confirmed production SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.KOL_PROD_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "KOL_PROD_SSH_PRIVATE_KEY is required" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fingerprint confirmed by the operator on 2026-10-02.
          printf '%s\n' '47.88.94.205 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGL0KFP8lQnrrAR81Q4aztoswNy3rBu6OTJaSthx5z6w' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy repaired revision and apply schema
        env:
          SHA: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_REVISION='${SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd ~/kol
          git fetch github "$DEPLOY_REVISION"
          git reset --hard "$DEPLOY_REVISION"
          bash scripts/apply-postgres-schema.sh
          sudo -n systemctl restart lingong
          REMOTE
      - name: Verify public revision and PostgreSQL readers
        env:
          EXPECTED_VERSION: ${{ steps.revision.outputs.sha }}
        run: |
          expected="${EXPECTED_VERSION:0:7}"
          for attempt in $(seq 1 36); do
            version="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "http://${DEPLOY_HOST}/api/version" || true)"
            actual="$(printf '%s' "$version" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              status="$(curl --silent --output /tmp/scheduling.json --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "http://${DEPLOY_HOST}/api/admin/scheduling/execution-jobs?limit=1" || true)"
              if [ "$status" = "200" ] || [ "$status" = "401" ]; then
                echo "PostgreSQL runtime repair verified at $actual (scheduling reader HTTP $status)."
                exit 0
              fi
              echo "scheduling reader returned HTTP ${status:-unavailable}: $(cat /tmp/scheduling.json 2>/dev/null || true)"
            else
              echo "Attempt ${attempt}/36: waiting for ${expected}; observed ${actual:-unavailable}."
            fi
            sleep 5
          done
          echo "::error::Production did not report the repaired revision and a working scheduling reader."
          exit 1
