name: lingong-release-gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate canonical KOL data
        working-directory: backend
        run: npm run validate:kol-data
      - name: Compile pilot contracts
        working-directory: backend
        run: npm run validate:contracts
      - name: Validate TB three-way binding
        working-directory: backend
        run: npm run validate:tb-binding
      - name: Compile production contracts
        working-directory: backend
        run: npm run validate:contracts -- --production
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend full deterministic tests
        working-directory: backend
        run: npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend E2E
        working-directory: frontend
        env:
          E2E_MODE: stub
          E2E_AUTH_MODE: disabled
          CODEX_MODE: stub
          E2E_PORT: "18876"
          E2E_BASE: http://127.0.0.1:18876
          E2E_SKIP_BUILD: "1"
          PW_HEADLESS: "1"
        run: npm run test:e2e
