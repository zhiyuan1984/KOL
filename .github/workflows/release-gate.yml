name: lingong-release-gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# A newer main commit supersedes an older in-flight release, but tags retain
# their own validation run. This prevents two deploy jobs from restarting the
# same service concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # 后端全量测试已按「PostgreSQL 模板库克隆」运行，且 vitest 配置为串行
    # （fileParallelism: false，见 backend/vitest.config.ts）：45 分钟不够，
    # 预发实测需要 1–2 小时，这里留足预算再触发 deploy-production。
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lingong
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: lingong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Optional offline mailbox/SOP source files contain operational data and
      # are ignored by Git. Portrait Markdown is not a release dependency.
      - name: Validate offline mailbox and SOP source when present
        working-directory: backend
        run: |
          if [ -d ../data/kol ]; then
            npm run validate:kol-data
          else
            echo "::notice::Optional offline mailbox/SOP source is absent; skipping this source-file check."
          fi
      - name: Compile pilot contracts
        working-directory: backend
        run: npm run validate:contracts
      # The remote master-data service has not yet registered the legacy TB
      # brand. Keep visibility of that known external-data gap without blocking
      # unrelated, verified production releases.
      - name: Report TB three-way binding availability
        continue-on-error: true
        working-directory: backend
        run: npm run validate:tb-binding
      - name: Compile production contracts
        working-directory: backend
        run: npm run validate:contracts -- --production
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: YouTube subscriber parser offline regression
        working-directory: backend
        run: python3 scripts/test-youtube-subscriber-count.py
      # 后端测试从 PostgreSQL 模板库克隆独立测试库（tests/support/pg.ts）：
      # 用空库跑一遍 schema 生成 lingong_template；测试步骤用 TEST_DATABASE_URL 指向管理库。
      - name: Prepare PostgreSQL test template
        working-directory: backend
        env:
          ADMIN_URL: postgresql://lingong:local-dev-only@127.0.0.1:5432/postgres
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.ADMIN_URL});await c.connect();const r=await c.query(\"SELECT 1 FROM pg_database WHERE datname='lingong_template'\");if(!r.rowCount)await c.query('CREATE DATABASE lingong_template');await c.end();})().catch((error)=>{console.error(error);process.exit(1)})"
          DATABASE_URL="postgresql://lingong:local-dev-only@127.0.0.1:5432/lingong_template" npm run db:apply:postgres-schema
          DATABASE_URL="postgresql://lingong:local-dev-only@127.0.0.1:5432/lingong_template" npm run db:seed:reference
      - name: Native PostgreSQL performance workflow and approvals
        working-directory: backend
        env:
          PERFORMANCE_TEST_DATABASE_URL: postgresql://lingong:local-dev-only@127.0.0.1:5432/postgres
        run: node node_modules/vitest/vitest.mjs run --config vitest.performance.config.ts --configLoader runner
      - name: Backend full deterministic tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://lingong:local-dev-only@127.0.0.1:5432/postgres
        run: npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Verify complete knowledge E2E partition
        working-directory: frontend
        run: node scripts/verify-native-knowledge-partition.mjs
      - name: Native authenticated knowledge configuration isolation
        run: node scripts/test-native-knowledge-config.mjs
      - name: Native production health positive and negative contracts
        run: node scripts/test-production-health.mjs
      - name: Prepare isolated native knowledge E2E database
        working-directory: backend
        env:
          ADMIN_URL: postgresql://lingong:local-dev-only@127.0.0.1:5432/postgres
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.ADMIN_URL});await c.connect();await c.query('CREATE DATABASE lingong_e2e_native_employee TEMPLATE lingong_template');await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Complete native authenticated knowledge E2E
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://lingong:local-dev-only@127.0.0.1:5432/lingong_e2e_native_employee
          TEST_DB_PREFIX: lingong_e2e
          NODE_ENV: test
          E2E_MODE: stub
          E2E_AUTH_MODE: enabled
          E2E_PORT: '8949'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.native-knowledge.config.ts --workers=1 --retries=0
      - name: Performance UI and Excel template regression
        working-directory: frontend
        run: node node_modules/@playwright/test/cli.js test --config playwright.performance.config.ts
      # E2E 在预发服务器上以 stub + PostgreSQL 运行（复用 ~/kol-e2e 与 lingong_e2e 测试库），
      # 不在 CI 内起 SQLite 实例；spec 集与 npm run test:e2e:release 保持一致。
      - name: E2E on staging server (PostgreSQL)
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.KOL_PROD_SSH_PRIVATE_KEY }}
          E2E_REVISION: ${{ github.sha }}
          E2E_SPECS: >-
            e2e/home-followed-legacy-projection.spec.ts
            e2e/home-followed-focus.spec.ts
            e2e/home-surface-failure.spec.ts
            e2e/discovery-presentation.spec.ts
            e2e/session-workspace-presentation.spec.ts
            e2e/home-followed-rail-layout.spec.ts
            e2e/review-workflow.spec.ts
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::warning::Staging E2E skipped: repository secret KOL_PROD_SSH_PRIVATE_KEY is not configured."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.88.94.205 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ecs-user@47.88.94.205 \
            "cd ~/kol-e2e && ./scripts/server-e2e.sh --rev '$E2E_REVISION' $E2E_SPECS"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ecs-user@47.88.94.205 \
            "cd ~/kol-e2e && ./scripts/server-e2e.sh --rev '$E2E_REVISION' --no-build --no-schema --config=playwright.runtime.config.ts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ecs-user@47.88.94.205 \
            "cd ~/kol-e2e/frontend && npm run test:e2e:agents"

  deploy-production:
    name: Deploy production
    needs: release-gate
    # Tags are validated but never deployed automatically. A workflow dispatch
    # on main is allowed for recovery after a transient infrastructure failure.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 47.88.94.205
      DEPLOY_USER: ecs-user
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - id: deploy-key
        name: Configure deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.KOL_PROD_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::warning::Deployment skipped: repository secret KOL_PROD_SSH_PRIVATE_KEY is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Pull the verified main revision and restart Lingong
        if: steps.deploy-key.outputs.configured == 'true'
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_REVISION='${DEPLOY_REVISION}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/kol
          # Other scoped releases may have changes on this host. A deployment
          # must never discard those files while updating the verified revision.
          # Untracked diagnostic files are retained; merge itself refuses any
          # untracked-file collision instead of deleting those local artifacts.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has local changes; preserve and reconcile them before deployment." >&2
            exit 1
          fi
          git fetch github "$DEPLOY_REVISION"
          if ! git merge-base --is-ancestor HEAD "$DEPLOY_REVISION"; then
            echo "Production history is not included in the verified revision; reconcile it before deployment." >&2
            exit 1
          fi
          git merge --ff-only "$DEPLOY_REVISION"
          if [ -d data/kol ]; then
            node backend/scripts/validate-kol-data.mjs
          else
            echo "Optional offline mailbox/SOP source is absent on this deployment host; skipping this source-file check."
          fi
          # The PostgreSQL authority is long-lived, so new tables/indexes must
          # be applied explicitly before the API starts querying them.
          bash scripts/apply-postgres-schema.sh
          # The new crawler.results handler must be loaded before the API can
          # enqueue it. Keep workers and the API on the same verified revision.
          sudo -n systemctl restart lingong-execution-worker@1 lingong-execution-worker@2 lingong-outbox
          bash scripts/deploy.sh
          REMOTE

      - name: Verify deployed revision
        if: steps.deploy-key.outputs.configured == 'true'
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # Native production retires /api/version. Verify both running readiness
          # and the build manifest bound to the full verified source revision.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "EXPECTED_VERSION='${EXPECTED_VERSION}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/kol
          [ "$(git rev-parse HEAD)" = "$EXPECTED_VERSION" ]
          node --input-type=module -e 'import fs from "node:fs"; const build=JSON.parse(fs.readFileSync("frontend/dist/release.json","utf8")); if(build.commit!==process.env.EXPECTED_VERSION) process.exit(1); console.log("Deployed full revision verified:",build.commit);'
          curl -H "Accept-Encoding: identity" -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:8765/api/health | node scripts/check-production-health.mjs
          for unit in lingong lingong-outbox lingong-execution-worker@1 lingong-execution-worker@2 lingong-cron-tick; do
            systemctl is-active --quiet "$unit"
          done
          REMOTE
